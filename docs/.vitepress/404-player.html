<style>
  /* ==THEME== 配色（LPのカスタマイズ機能はここを書き換えます） */
  :root {
    --t-bg: #14081f;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

    background: var(--t-bg);

  .num {
    font-size: clamp(72px, 18vw, 120px); font-weight: 700; line-height: 1;

  #intro h1 { font-size: clamp(16px, 4vw, 21px); font-weight: 700; margin: 18px 0 12px; letter-spacing: 0.04em; }
  #intro p { font-size: 13.5px; line-height: 2.05; color: color-mix(in srgb, var(--t-ink) 60%, transparent); }
  #intro p b { color: var(--t-ink); }
  .hint {
    margin: 30px auto 0; max-width: 460px;
    border: 1px dashed color-mix(in srgb, var(--t-accent) 50%, transparent); padding: 16px 18px;
    cursor: pointer; user-select: none; font-size: 13px; line-height: 1.9;
    transition: border-color 0.25s, background 0.25s;
  }
  .hint:hover { border-color: var(--t-accent); background: color-mix(in srgb, var(--t-accent) 8%, transparent); }
  .hint b { display: inline-block; border: 1px solid var(--t-accent); color: var(--t-accent); padding: 2px 9px; margin-top: 7px; font-size: 11.5px; letter-spacing: 0.16em; }

  #game { position: fixed; inset: 0; z-index: 20; display: none; touch-action: none; }
  #cv { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 16px; right: 18px; z-index: 40; display: none;
    text-align: right; pointer-events: none;
    font-size: 12.5px; letter-spacing: 0.12em; line-height: 1.75;
  }
  #hud .t { font-size: 22px; font-weight: 700; color: var(--t-accent); line-height: 1.2; }
  #xpTrack {
    width: min(180px, 40vw); height: 4px;
    margin: 8px 0 0 auto;
    background: color-mix(in srgb, var(--t-ink) 14%, transparent);
  }
  #xpBar { height: 100%; width: 0; background: var(--t-sub); transition: width 0.15s; }

  #snd {
    position: fixed; bottom: 14px; right: 18px; z-index: 40;
    font-family: inherit; font-size: 11px; letter-spacing: 0.14em;
    background: none; border: 1px solid color-mix(in srgb, var(--t-ink) 35%, transparent); color: color-mix(in srgb, var(--t-ink) 55%, transparent);
    padding: 6px 12px; cursor: pointer;
  }
  #snd[aria-pressed="true"] { border-color: var(--t-ink); color: var(--t-ink); }

  /* レベルアップ選択 */
  #lvl {
    position: fixed; inset: 0; z-index: 35; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: color-mix(in srgb, var(--t-bg) 86%, transparent); padding: 20px;
  }
  #lvl h2 { font-size: 17px; letter-spacing: 0.22em; color: var(--t-sub); margin-bottom: 20px; }
  #lvlBtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #lvlBtns button {
    font-family: inherit; width: min(200px, 86vw);
    background: color-mix(in srgb, var(--t-ink) 6%, var(--t-bg)); color: var(--t-ink);
    border: 1px solid color-mix(in srgb, var(--t-ink) 35%, transparent);
    padding: 18px 14px 16px; cursor: pointer; text-align: center;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
  }
  #lvlBtns button:hover { border-color: var(--t-accent); background: color-mix(in srgb, var(--t-ink) 12%, var(--t-bg)); transform: translateY(-2px); }
  #lvlBtns .ic { display: block; font-size: 24px; margin-bottom: 10px; }
  #lvlBtns .nm { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 6px; color: var(--t-accent); }
  #lvlBtns .ds { display: block; font-size: 11.5px; line-height: 1.8; color: color-mix(in srgb, var(--t-ink) 65%, transparent); }

  #result {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: color-mix(in srgb, var(--t-bg) 92%, transparent); padding: 20px;
  }
  #result h2 { font-size: clamp(26px, 6.4vw, 46px); font-weight: 700; letter-spacing: 0.05em; color: var(--t-sub); text-shadow: 0 0 24px color-mix(in srgb, var(--t-sub) 40%, transparent); }
  #result h2.bad { color: var(--t-accent); text-shadow: 0 0 24px color-mix(in srgb, var(--t-accent) 40%, transparent); }
  #result p { margin-top: 12px; font-size: 13.5px; line-height: 2.1; color: color-mix(in srgb, var(--t-ink) 75%, transparent); }
  #result .btns { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #result button, #result a {
    font-family: inherit; font-size: 12.5px; letter-spacing: 0.12em;
    border: 1px solid var(--t-ink); background: transparent; color: var(--t-ink);
    padding: 11px 24px; cursor: pointer; text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  #result button:hover, #result a:hover { background: var(--t-ink); color: var(--t-bg); }

<script>
/* ============================================================
   配色テーマ：CSS冒頭の ==THEME== ブロック（--t-*）が正です。
   LPのカスタマイズ機能から届くライブ変更もここで受けます。
   ============================================================ */
(function () {
  var KEYS = ["bg", "ink", "accent", "sub", "enemy"];
  var T = window.PLAYER404_THEME = {};
  function read() {
    var cs = getComputedStyle(document.documentElement);
    KEYS.forEach(function (k) {
      var v = cs.getPropertyValue("--t-" + k).trim();
      if (v) T[k] = v;
    });
  }
  read();
  if (window.parent !== window) {
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.type !== "player404:theme") return;
      if (d.vars) {
        Object.keys(d.vars).forEach(function (k) {
          if (KEYS.indexOf(k) !== -1 && /^#[0-9a-fA-F]{6}$/.test(String(d.vars[k]))) {
            document.documentElement.style.setProperty("--t-" + k, d.vars[k]);
          }
        });
        read();
      }
      if (typeof d.emoji === "string" && d.emoji.length <= 4 && window.PLAYER404_CONFIG) {
        window.PLAYER404_CONFIG.playerEmoji = d.emoji;
      }
    });
  }
})();
</script>

<script>
(function () {
  "use strict";
  var CFG = window.PLAYER404_CONFIG || {};
  var TH = window.PLAYER404_THEME || {};
  function tint(hex, a) {
    var n = parseInt(String(hex).slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
  }
  function mixHex(h1, h2, t) {
    var a = parseInt(String(h1).slice(1), 16), b = parseInt(String(h2).slice(1), 16);
    var r = Math.round((a >> 16 & 255) * (1 - t) + (b >> 16 & 255) * t);
    var g = Math.round((a >> 8 & 255) * (1 - t) + (b >> 8 & 255) * t);
    var bl = Math.round((a & 255) * (1 - t) + (b & 255) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  var LANG = (CFG.lang === "auto" || !CFG.lang)
    ? ((navigator.language || "en").toLowerCase().indexOf("ja") === 0 ? "ja" : "en")
    : CFG.lang;

  var GOAL_SEC = 60;

  var T = {
    ja: {
      title: "このページは、404の大群に飲み込まれました",
      body: "お探しのページはもう存在しません。<br>ここで生き残っているのは——<b>あなただけ</b>です。",
      hint: "移動するだけで自動攻撃。エラーの大群から60秒間生き延びてください。",
      key: "SPACE / TAP TO SURVIVE",
      lv: "LV", kills: "KILLS",
      lvlTitle: "LEVEL UP — ひとつ選ぶ",
      win: "200 OK — SURVIVED",
      winText1: "{S}秒間、生き延びました。ページは消えても、あなたは消えません。",
      lose: "CONNECTION LOST",
      loseText1: "大群に飲まれました。生存 ",
      loseText2: " 秒。もう一度？",
      retry: "RETRY", homeBtn: "HOME",
      ups: {
        power:  ["火力アップ", "弾のダメージ +1"],
        rapid:  ["連射アップ", "発射間隔 -20%"],
        multi:  ["弾数アップ", "同時発射 +1"],
        speed:  ["俊足", "移動速度 +15%"],
        magnet: ["磁力", "回収範囲 +50%"],
        orbit:  ["周回ガード", "「/」が周囲を回って敵を削る"],
        heart:  ["予備ライフ", "HP +1"],
        pierce: ["貫通弾", "弾が敵を貫通 +1"]
      }
    },
    en: {
      title: "This page has been overrun by 404s",
      body: "The page you were looking for is gone.<br>The only survivor here is <b>you</b>.",
      hint: "Just move — you attack automatically. Survive the swarm for 60 seconds.",
      key: "SPACE / TAP TO SURVIVE",
      lv: "LV", kills: "KILLS",
      lvlTitle: "LEVEL UP — CHOOSE ONE",
      win: "200 OK — SURVIVED",
      winText1: "You survived the full {S} seconds. Pages die. You don't.",
      lose: "CONNECTION LOST",
      loseText1: "The swarm got you. Survived ",
      loseText2: "s. Once more?",
      retry: "RETRY", homeBtn: "HOME",
      ups: {
        power:  ["Firepower", "Bullet damage +1"],
        rapid:  ["Rapid fire", "Fire interval -20%"],
        multi:  ["Multishot", "Bullets per shot +1"],
        speed:  ["Swift", "Move speed +15%"],
        magnet: ["Magnet", "Pickup range +50%"],
        orbit:  ["Orbit guard", "A “/” circles you, grinding enemies"],
        heart:  ["Spare life", "HP +1"],
        pierce: ["Piercing", "Bullets pierce +1 enemy"]
      }
    }
  }[LANG];

  var UP_ICONS = { power: "▲", rapid: "≫", multi: "∴", speed: "→", magnet: "◎", orbit: "/", heart: "+", pierce: "†" };

  document.documentElement.lang = LANG;

  var $ = function (id) { return document.getElementById(id); };
  var intro = $("intro"), hint = $("hint");
  var game = $("game"), cv = $("cv"), ctx = cv.getContext("2d");
  var hud = $("hud"), sndBtn = $("snd"), result = $("result"), lvlBox = $("lvl");

  $("homeLink").href = CFG.homeUrl || "/";
  if (CFG.siteName) $("homeLink").textContent = "← " + CFG.siteName.toUpperCase();
  $("resHome").href = CFG.homeUrl || "/";
  $("resHome").textContent = T.homeBtn;
  $("btnRetry").textContent = T.retry;
  $("txtTitle").textContent = T.title;
  $("txtBody").innerHTML = T.body;
  $("txtHint").textContent = T.hint;
  $("txtKey").textContent = T.key;
  $("lvlTitle").textContent = T.lvlTitle;

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demoMode = new URLSearchParams(location.search).get("demo") === "1";
  var demoCpu = demoMode, demoActive = !demoMode, demoReplay = 0;
  if (demoMode) GOAL_SEC = 20;

  /* ---- サウンド（ブラウザ内合成・既定ON） ---- */
  var soundOn = !demoMode && CFG.sound !== false, ac = null;
  function beep(freq, dur, vol, type) {
    if (!soundOn) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.04, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + (dur || 0.08));
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + (dur || 0.08));
    } catch (e) { /* no audio */ }
  }
  if (CFG.sound !== false && !demoMode) {
    sndBtn.hidden = false;
    sndBtn.addEventListener("click", function () {
      soundOn = !soundOn;
      sndBtn.setAttribute("aria-pressed", String(soundOn));
      sndBtn.textContent = "SOUND: " + (soundOn ? "ON" : "OFF");
      if (soundOn) beep(880, 0.06, 0.04);
    });
  }

  /* ---- 状態 ---- */
  var W = 0, H = 0, DPR = 1;
  var running = false, paused = false, raf = 0, lastTs = 0;
  var player, bullets, enemies, gems, parts, rings;
  var time, kills, level, xp, xpNext, shake, flash;
  var stats, fireT, spawnT, eliteT, orbitA;
  var keys = {}, joy = null;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  function reset() {
    player = { x: W / 2, y: H / 2, r: 13, hp: 3, hpMax: 5, inv: 0 };
    bullets = []; enemies = []; gems = []; parts = []; rings = [];
    time = 0; kills = 0; level = 1; xp = 0; xpNext = 5;
    shake = 0; flash = 0;
    stats = { dmg: 1, rate: 0.55, count: 1, speed: 175, magnet: 70, orbit: 0, pierce: 0 };
    fireT = 0.3; spawnT = 0.4; eliteT = 16; orbitA = 0;
    lastTs = 0;
  }

  /* ---- エフェクト ---- */
  function burst(x, y, col, n) {
    if (reduceMotion) return;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 150;
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 2 + Math.random() * 3.6, col: col, life: 0.35 + Math.random() * 0.25, max: 0.6 });
    }
  }
  function ring(x, y, col) {
    if (reduceMotion) return;
    rings.push({ x: x, y: y, r: 8, col: col, life: 0.4, max: 0.4 });
  }

  /* ---- 敵 ---- */
  function spawnEnemy(elite) {
    var side = Math.floor(Math.random() * 4);
    var x = side === 0 ? -30 : side === 1 ? W + 30 : Math.random() * W;
    var y = side < 2 ? Math.random() * H : (side === 2 ? -30 : H + 30);
    var tScale = 1 + time * 0.012;
    if (elite) {
      enemies.push({ x: x, y: y, g: "404", r: 26, hp: 8 + Math.floor(time / 10), sp: 26 * tScale, fs: 30, col: TH.accent, xp: 5, elite: true, hitT: 0 });
    } else if (Math.random() < 0.68) {
      enemies.push({ x: x, y: y, g: "4", r: 12, hp: 1, sp: (46 + Math.random() * 22) * tScale, fs: 24, col: mixHex(TH.enemy, TH.ink, 0.35), xp: 1, hitT: 0 });
    } else {
      enemies.push({ x: x, y: y, g: "0", r: 16, hp: 3, sp: (30 + Math.random() * 14) * tScale, fs: 30, col: TH.enemy, xp: 2, hitT: 0 });
    }
  }

  /* ---- 自動攻撃 ---- */
  function fire() {
    var targets = enemies.slice().sort(function (a, b) {
      var da = (a.x - player.x) * (a.x - player.x) + (a.y - player.y) * (a.y - player.y);
      var db = (b.x - player.x) * (b.x - player.x) + (b.y - player.y) * (b.y - player.y);
      return da - db;
    });
    if (!targets.length) return;
    for (var i = 0; i < stats.count; i++) {
      var t = targets[Math.min(i, targets.length - 1)];
      var dx = t.x - player.x, dy = t.y - player.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      /* 同一ターゲットに複数発射するときは少し散らす */
      var spread = (i >= targets.length) ? (Math.random() - 0.5) * 0.5 : 0;
      var a = Math.atan2(dy, dx) + spread;
      bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, r: 4, dmg: stats.dmg, pierce: stats.pierce, hit: [] });
    }
    beep(1200 + Math.random() * 300, 0.03, 0.016);
  }

  function hitEnemy(e, dmg, i) {
    e.hp -= dmg; e.hitT = 0.1;
    if (e.hp <= 0) {
      enemies.splice(i, 1);
      kills++;
      burst(e.x, e.y, e.col, e.elite ? 26 : 10);
      if (e.elite) { ring(e.x, e.y, TH.accent); shake = Math.max(shake, 8); }
      beep(e.elite ? 200 : 300 + Math.random() * 120, 0.08, 0.035, "sawtooth");
      var n = e.xp;
      while (n-- > 0) {
        gems.push({ x: e.x + (Math.random() - 0.5) * 22, y: e.y + (Math.random() - 0.5) * 22, r: 4, v: 0 });
      }
      return true;
    }
    beep(500, 0.03, 0.02);
    return false;
  }

  /* ---- レベルアップ ---- */
  var UP_KEYS = ["power", "rapid", "multi", "speed", "magnet", "orbit", "heart", "pierce"];
  function availableUps() {
    return UP_KEYS.filter(function (k) {
      if (k === "multi") return stats.count < 5;
      if (k === "orbit") return stats.orbit < 4;
      if (k === "heart") return player.hp < player.hpMax;
      if (k === "rapid") return stats.rate > 0.18;
      if (k === "pierce") return stats.pierce < 3;
      return true;
    });
  }
  function applyUp(k) {
    if (k === "power") stats.dmg += 1;
    if (k === "rapid") stats.rate = Math.max(0.15, stats.rate * 0.8);
    if (k === "multi") stats.count += 1;
    if (k === "speed") stats.speed *= 1.15;
    if (k === "magnet") stats.magnet *= 1.5;
    if (k === "orbit") stats.orbit += 1;
    if (k === "heart") player.hp = Math.min(player.hpMax, player.hp + 1);
    if (k === "pierce") stats.pierce += 1;
  }
  function levelUp() {
    level++;
    xp -= xpNext;
    xpNext = 4 + level * 3;
    paused = true;
    beep(660, 0.09, 0.05, "triangle");
    setTimeout(function () { beep(880, 0.12, 0.05, "triangle"); }, 90);
    var pool = availableUps();
    var picks = [];
    while (picks.length < 3 && pool.length) {
      picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    var box = $("lvlBtns");
    box.innerHTML = "";
    function chooseUp(k) {
      if (!paused) return;
      applyUp(k);
      lvlBox.style.display = "none";
      paused = false;
      lastTs = 0;
      beep(1046, 0.08, 0.045);
    }
    picks.forEach(function (k) {
      var b = document.createElement("button");
      b.innerHTML = '<span class="ic">' + UP_ICONS[k] + '</span><span class="nm">' + T.ups[k][0] + '</span><span class="ds">' + T.ups[k][1] + "</span>";
      b.addEventListener("click", function () { chooseUp(k); });
      box.appendChild(b);
    });
    lvlBox.style.display = "flex";
    if (demoCpu) {
      setTimeout(function () {
        if (!demoCpu || !paused) return;
        var priority = ["heart", "rapid", "multi", "power", "orbit", "speed", "magnet", "pierce"];
        picks.sort(function (a, b) { return priority.indexOf(a) - priority.indexOf(b); });
        chooseUp(picks[0]);
      }, 480);
    }
  }

  /* ---- 進行 ---- */
  function start() {
    if (running) return;
    running = true; paused = false;
    intro.style.display = "none";
    game.style.display = "block";
    result.style.display = "none";
    lvlBox.style.display = "none";
    hud.style.display = "block";
    resize(); reset();
    beep(660, 0.08, 0.04);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function end(win) {
    running = false;
    cancelAnimationFrame(raf);
    beep(win ? 1046 : 110, 0.3, 0.05, win ? "triangle" : "sawtooth");
    if (win) setTimeout(function () { beep(1318, 0.25, 0.05, "triangle"); }, 140);
    setTimeout(function () {
      $("resTitle").textContent = win ? T.win : T.lose;
      $("resTitle").className = win ? "" : "bad";
      $("resText").textContent = win
        ? T.winText1.replace("{S}", GOAL_SEC) + "  [" + T.lv + " " + level + " / " + T.kills + " " + kills + "]"
        : T.loseText1 + Math.floor(time) + T.loseText2 + "  [" + T.lv + " " + level + " / " + T.kills + " " + kills + "]";
      result.style.display = "flex";
      if (demoCpu) {
        clearTimeout(demoReplay);
        demoReplay = setTimeout(function () { if (demoCpu && demoActive) start(); }, 1500);
      }
    }, reduceMotion ? 0 : 650);
  }

  function step(dt) {
    time += dt;
    if (time >= GOAL_SEC) {
      burst(player.x, player.y, TH.sub, 40);
      end(true); return;
    }

    /* 移動入力 */
    var mx = 0, my = 0;
    if (demoCpu) {
      /* 敵から離れつつ、余裕があるときは経験値へ寄る */
      mx = (W / 2 - player.x) * 0.003;
      my = (H / 2 - player.y) * 0.003;
      var nearestThreat = 9999;
      enemies.forEach(function (en) {
        var dx = en.x - player.x, dy = en.y - player.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        nearestThreat = Math.min(nearestThreat, d);
        if (d < 190) {
          var force = (190 - d) / 190 * (en.elite ? 2.2 : 1.35);
          mx -= (dx / d) * force; my -= (dy / d) * force;
        }
      });
      if (gems.length && nearestThreat > 75) {
        var gem = gems.slice().sort(function (a, b) {
          var ad = (a.x - player.x) * (a.x - player.x) + (a.y - player.y) * (a.y - player.y);
          var bd = (b.x - player.x) * (b.x - player.x) + (b.y - player.y) * (b.y - player.y);
          return ad - bd;
        })[0];
        var gdx0 = gem.x - player.x, gdy0 = gem.y - player.y;
        var gd0 = Math.sqrt(gdx0 * gdx0 + gdy0 * gdy0) || 1;
        mx += (gdx0 / gd0) * 0.7; my += (gdy0 / gd0) * 0.7;
      }
      if (player.x < 55) mx += 1.4; else if (player.x > W - 55) mx -= 1.4;
      if (player.y < 55) my += 1.4; else if (player.y > H - 55) my -= 1.4;
    } else {
      if (keys.ArrowLeft || keys.KeyA) mx -= 1;
      if (keys.ArrowRight || keys.KeyD) mx += 1;
      if (keys.ArrowUp || keys.KeyW) my -= 1;
      if (keys.ArrowDown || keys.KeyS) my += 1;
      if (joy) { mx = joy.dx; my = joy.dy; }
    }
    var ml = Math.sqrt(mx * mx + my * my);
    if (ml > 1) { mx /= ml; my /= ml; }
    player.x = Math.max(player.r, Math.min(W - player.r, player.x + mx * stats.speed * dt));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y + my * stats.speed * dt));
    if (player.inv > 0) player.inv -= dt;

    /* スポーン */
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnEnemy(false);
      if (time > 25 && Math.random() < 0.35) spawnEnemy(false);
      spawnT = Math.max(0.22, 1.0 - time * 0.012);
    }
    eliteT -= dt;
    if (eliteT <= 0) { spawnEnemy(true); eliteT = 15; }

    /* 発射 */
    fireT -= dt;
    if (fireT <= 0) { fire(); fireT = stats.rate; }

    /* 弾 */
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }
      for (var j = enemies.length - 1; j >= 0; j--) {
        var e = enemies[j];
        if (b.hit.indexOf(e) !== -1) continue;
        var dx = e.x - b.x, dy = e.y - b.y;
        if (dx * dx + dy * dy < (e.r + b.r) * (e.r + b.r)) {
          hitEnemy(e, b.dmg, j);
          if (b.pierce > 0) { b.pierce--; b.hit.push(e); }
          else { bullets.splice(i, 1); }
          break;
        }
      }
    }

    /* 周回ガード */
    orbitA += dt * 3.2;
    if (stats.orbit > 0) {
      for (var o = 0; o < stats.orbit; o++) {
        var oa = orbitA + (o / stats.orbit) * Math.PI * 2;
        var ox = player.x + Math.cos(oa) * 58, oy = player.y + Math.sin(oa) * 58;
        for (var k = enemies.length - 1; k >= 0; k--) {
          var oe = enemies[k];
          var odx = oe.x - ox, ody = oe.y - oy;
          if (odx * odx + ody * ody < (oe.r + 12) * (oe.r + 12) && oe.hitT <= 0) {
            hitEnemy(oe, 1, k);
          }
        }
      }
    }

    /* 敵 */
    for (var m = enemies.length - 1; m >= 0; m--) {
      var en = enemies[m];
      var edx = player.x - en.x, edy = player.y - en.y;
      var ed = Math.sqrt(edx * edx + edy * edy) || 1;
      en.x += (edx / ed) * en.sp * dt;
      en.y += (edy / ed) * en.sp * dt;
      if (en.hitT > 0) en.hitT -= dt;
      if (ed < en.r + player.r - 4 && player.inv <= 0) {
        player.hp--;
        player.inv = 1.1;
        shake = reduceMotion ? 0 : 14;
        flash = reduceMotion ? 0 : 0.4;
        burst(player.x, player.y, TH.accent, 18);
        beep(120, 0.25, 0.055, "sawtooth");
        if (player.hp <= 0) { end(false); return; }
      }
    }

    /* ジェム */
    for (var g2 = gems.length - 1; g2 >= 0; g2--) {
      var gm = gems[g2];
      var gdx = player.x - gm.x, gdy = player.y - gm.y;
      var gd = Math.sqrt(gdx * gdx + gdy * gdy) || 1;
      if (gd < stats.magnet) gm.v = Math.min(gm.v + 900 * dt, 520);
      if (gm.v > 0) { gm.x += (gdx / gd) * gm.v * dt; gm.y += (gdy / gd) * gm.v * dt; }
      if (gd < player.r + 8) {
        gems.splice(g2, 1);
        xp++;
        beep(1568, 0.04, 0.022, "triangle");
        if (xp >= xpNext) { levelUp(); }
      }
    }

    /* パーティクル */
    for (var p2 = parts.length - 1; p2 >= 0; p2--) {
      var pp = parts[p2];
      pp.x += pp.vx * dt; pp.y += pp.vy * dt;
      pp.vx *= 0.92; pp.vy *= 0.92;
      pp.life -= dt;
      if (pp.life <= 0) parts.splice(p2, 1);
    }
    for (var r2 = rings.length - 1; r2 >= 0; r2--) {
      rings[r2].r += 260 * dt; rings[r2].life -= dt;
      if (rings[r2].life <= 0) rings.splice(r2, 1);
    }
    if (shake > 0) shake *= Math.pow(0.0001, dt);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.4);

    /* HUD */
    var hearts = "";
    for (var h2 = 0; h2 < player.hpMax; h2++) hearts += h2 < player.hp ? "♥" : "·";
    $("hudL").textContent = T.lv + " " + level + "  " + hearts;
    $("hudT").textContent = Math.ceil(GOAL_SEC - time);
    $("hudR").textContent = T.kills + " " + kills;
    $("xpBar").style.width = Math.min(100, (xp / xpNext) * 100) + "%";
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    /* 床のグリッド */
    ctx.strokeStyle = tint(TH.ink, 0.05);
    ctx.lineWidth = 1;
    for (var gx = 0; gx < W; gx += 56) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (var gy = 0; gy < H; gy += 56) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

    /* ジェム */
    ctx.fillStyle = TH.sub;
    gems.forEach(function (gm) {
      ctx.save();
      ctx.translate(gm.x, gm.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-3.2, -3.2, 6.4, 6.4);
      ctx.restore();
    });

    /* 弾 */
    ctx.fillStyle = TH.ink;
    bullets.forEach(function (b) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    });

    /* 周回ガード */
    if (stats.orbit > 0) {
      ctx.fillStyle = TH.sub;
      ctx.font = '700 26px "Courier New", monospace';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (var o = 0; o < stats.orbit; o++) {
        var oa = orbitA + (o / stats.orbit) * Math.PI * 2;
        ctx.fillText("/", player.x + Math.cos(oa) * 58, player.y + Math.sin(oa) * 58);
      }
    }

    /* 敵 */
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    enemies.forEach(function (e) {
      ctx.font = "700 " + e.fs + 'px "Courier New", monospace';
      ctx.fillStyle = e.hitT > 0 ? TH.ink : e.col;
      ctx.fillText(e.g, e.x, e.y);
    });

    /* プレイヤー（生き残ったページ / 絵文字設定時はキャラクター） */
    var blink = player.inv > 0 && Math.floor(player.inv * 10) % 2 === 0;
    if (!blink) {
      if (CFG.playerEmoji) {
        ctx.font = '30px sans-serif';
        ctx.fillText(CFG.playerEmoji, player.x, player.y);
      } else {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowColor = TH.sub; ctx.shadowBlur = 16;
        ctx.fillStyle = TH.ink;
        ctx.strokeStyle = TH.bg; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-10, -13); ctx.lineTo(4, -13); ctx.lineTo(10, -7);
        ctx.lineTo(10, 13); ctx.lineTo(-10, 13); ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = TH.bg;
        ctx.beginPath(); ctx.arc(-3, 0, 1.6, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(4, 0, 1.6, 0, 7); ctx.fill();
        ctx.restore();
      }
    }
    ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";

    /* パーティクル・リング */
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      ctx.globalAlpha = 1;
    });
    ctx.lineWidth = 3;
    rings.forEach(function (rg) {
      ctx.globalAlpha = Math.max(0, rg.life / rg.max);
      ctx.strokeStyle = rg.col;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    });

    /* バーチャルスティック */
    if (joy && joy.show) {
      ctx.strokeStyle = tint(TH.ink, 0.3);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.bx, joy.by, 44, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = tint(TH.ink, 0.4);
      ctx.beginPath(); ctx.arc(joy.bx + joy.dx * 34, joy.by + joy.dy * 34, 16, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    /* 被弾フラッシュ */
    if (flash > 0) {
      ctx.fillStyle = tint(TH.accent, flash * 0.4);
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(ts) {
    if (!running || (demoMode && !demoActive)) { raf = 0; lastTs = 0; return; }
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    if (!paused) step(dt);
    if (running) { draw(); raf = requestAnimationFrame(loop); }
  }

  /* ---- 入力 ---- */
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" && !running && result.style.display !== "flex") { e.preventDefault(); start(); return; }
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyW", "KeyA", "KeyS", "KeyD"].indexOf(e.code) !== -1) {
      e.preventDefault();
      keys[e.code] = true;
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  game.addEventListener("pointerdown", function (e) {
    if (!running) return;
    e.preventDefault();
    joy = { bx: e.clientX, by: e.clientY, dx: 0, dy: 0, id: e.pointerId, show: true };
  });
  game.addEventListener("pointermove", function (e) {
    if (!joy || e.pointerId !== joy.id) return;
    e.preventDefault();
    var dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    var d = Math.sqrt(dx * dx + dy * dy);
    var cl = Math.min(d, 44) / 44;
    if (d > 0) { joy.dx = (dx / d) * cl; joy.dy = (dy / d) * cl; }
  });
  function joyEnd(e) { if (joy && e.pointerId === joy.id) joy = null; }
  game.addEventListener("pointerup", joyEnd);
  game.addEventListener("pointercancel", joyEnd);

  hint.addEventListener("click", start);
  hint.addEventListener("keydown", function (e) {
    if (e.code === "Enter" || e.code === "Space") { e.preventDefault(); start(); }
  });
  $("btnRetry").addEventListener("click", start);

  /* ---- 一覧プレビュー専用デモ制御 ---- */
  function setDemoActive(active) {
    if (!demoMode || demoActive === active) return;
    demoActive = active;
    if (!active) {
      cancelAnimationFrame(raf); raf = 0; lastTs = 0;
    } else if (running && !raf) {
      raf = requestAnimationFrame(loop);
    } else if (!running && demoCpu) {
      start();
    }
  }
  window.addEventListener("message", function (e) {
    if (!demoMode || (location.protocol !== "file:" && e.origin !== location.origin) || !e.data) return;
    if (e.data.type === "player404:demo-active") setDemoActive(!!e.data.active);
    if (e.data.type === "player404:demo-control") {
      demoCpu = e.data.mode !== "user";
      if (!demoCpu) clearTimeout(demoReplay);
      else if (demoActive && !running) start();
    }
  });

  resize();
})();
</script>
</body>
